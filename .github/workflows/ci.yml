name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default least-privilege.
permissions:
  contents: read

jobs:
  check:
    name: pnpm check (${{ matrix.os }} sox=${{ matrix.sox }})
    runs-on: ${{ matrix.os }}
    # `src/lib/` is pure TS/Node — no platform-specific code, so we run the
    # `without` variant on Linux only (the cheaper runner). The `with` variant
    # runs on both Linux and macOS because sox versions differ between apt
    # and Homebrew, and the cible utilisatrice est principalement macOS —
    # any divergence on the sox fast-path must be caught on the target OS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sox: without
          - os: ubuntu-latest
            sox: with
          - os: macos-latest
            sox: with
    steps:
      - uses: actions/checkout@v6
        with:
          # Required for the integration tests that read real Teensy/
          # AudioMoth WAV fixtures from test-data/ (committed via LFS).
          lfs: true
      # scripts/ is out-of-tsconfig/out-of-eslint (see CLAUDE.md), so this is
      # the only check that ever runs against install.sh on `main` — load-
      # bearing now that the self-update path pins to each release's own tag
      # (Chantier D): a syntax error merged to main would otherwise go
      # unnoticed until the next tagged release's smoke test.
      - name: Syntax-check install.sh
        run: bash -n scripts/install.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      # Pinned: keep CI on the same bun that builds release binaries.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install sox (Linux)
        if: matrix.sox == 'with' && runner.os == 'Linux'
        run: sudo apt-get install -y sox
      - name: Install sox (macOS)
        if: matrix.sox == 'with' && runner.os == 'macOS'
        run: brew install sox
      # bsdtar is one of the three independent zip extractors the archive
      # tests validate against, and those tests hard-fail (rather than skip)
      # when a tool is missing on CI. unzip and python3 ship with the runner
      # images; bsdtar does not on Linux.
      - name: Install bsdtar (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libarchive-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  smoke-build:
    name: smoke ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      # Pinned: keep CI on the same bun that builds release binaries.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # Installed so --self-test exercises both engines (worker pool + sox)
      # and their byte-identity guarantee inside the compiled binary.
      - name: Install sox (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y sox
      - name: Install sox (macOS)
        if: runner.os == 'macOS'
        run: brew install sox
      - run: pnpm install --frozen-lockfile
      - name: Build binary
        run: pnpm build:${{ matrix.target }}
      - name: Smoke test — --version
        run: |
          OUTPUT=$(./dist/chiro-${{ matrix.target }} --version)
          echo "Got: $OUTPUT"
          if [[ "$OUTPUT" != chiro* ]]; then
            echo "::error::Expected output to start with 'chiro', got: $OUTPUT"
            exit 1
          fi
      - name: Smoke test — --help
        run: |
          OUTPUT=$(./dist/chiro-${{ matrix.target }} --help)
          echo "Got: $OUTPUT"
          if [[ -z "$OUTPUT" ]]; then
            echo "::error::--help produced no output"
            exit 1
          fi
      - name: Smoke test — --self-test
        run: |
          set +e
          OUTPUT=$(./dist/chiro-${{ matrix.target }} --self-test 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [[ $STATUS -ne 0 ]]; then
            echo "::error::--self-test exited with status $STATUS"
            exit 1
          fi
          if [[ "$OUTPUT" != *"byte-identique au pool"* ]]; then
            echo "::error::sox fast-path did not run — expected the byte-identity check"
            exit 1
          fi
      # Same binary, sox path disabled: forces the worker-pool engine, the
      # part that depends on /$bunfs/ asset resolution. No container needed —
      # the compiled binary's glibc floor is a property of the pinned bun
      # runtime, not of anything this runner does (re-check manually on a
      # bun pin bump, see CLAUDE.md).
      - name: Smoke test — --self-test (worker pool only)
        env:
          CHIRO_DISABLE_FASTPATH: "1"
        run: |
          set +e
          OUTPUT=$(./dist/chiro-${{ matrix.target }} --self-test 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [[ $STATUS -ne 0 ]]; then
            echo "::error::--self-test (no sox) exited with status $STATUS"
            exit 1
          fi
          if [[ "$OUTPUT" != *"sox : absent"* ]]; then
            echo "::error::expected the no-sox path — kill-switch not honored?"
            exit 1
          fi
