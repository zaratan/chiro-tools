name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default least-privilege.
permissions:
  contents: read

jobs:
  check:
    name: pnpm check (${{ matrix.os }} sox=${{ matrix.sox }})
    runs-on: ${{ matrix.os }}
    # `src/lib/` is pure TS/Node — no platform-specific code, so we run the
    # `without` variant on Linux only (the cheaper runner). The `with` variant
    # runs on both Linux and macOS because sox versions differ between apt
    # and Homebrew, and the cible utilisatrice est principalement macOS —
    # any divergence on the sox fast-path must be caught on the target OS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sox: without
          - os: ubuntu-latest
            sox: with
          - os: macos-latest
            sox: with
    steps:
      - uses: actions/checkout@v6
        with:
          # Required for the integration tests that read real Teensy/
          # AudioMoth WAV fixtures from test-data/ (committed via LFS).
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      # Pinned: keep CI on the same bun that builds release binaries.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install sox (Linux)
        if: matrix.sox == 'with' && runner.os == 'Linux'
        run: sudo apt-get install -y sox
      - name: Install sox (macOS)
        if: matrix.sox == 'with' && runner.os == 'macOS'
        run: brew install sox
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  smoke-build:
    name: smoke ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      # Pinned: keep CI on the same bun that builds release binaries.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # Installed so --self-test exercises both engines (worker pool + sox)
      # and their byte-identity guarantee inside the compiled binary.
      - name: Install sox (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y sox
      - name: Install sox (macOS)
        if: runner.os == 'macOS'
        run: brew install sox
      - run: pnpm install --frozen-lockfile
      - name: Build binary
        run: pnpm build:${{ matrix.target }}
      - name: Smoke test — --version
        run: |
          OUTPUT=$(./dist/chiro-${{ matrix.target }} --version)
          echo "Got: $OUTPUT"
          if [[ "$OUTPUT" != chiro* ]]; then
            echo "::error::Expected output to start with 'chiro', got: $OUTPUT"
            exit 1
          fi
      - name: Smoke test — --help
        run: |
          OUTPUT=$(./dist/chiro-${{ matrix.target }} --help)
          echo "Got: $OUTPUT"
          if [[ -z "$OUTPUT" ]]; then
            echo "::error::--help produced no output"
            exit 1
          fi
      - name: Smoke test — --self-test
        run: |
          set +e
          OUTPUT=$(./dist/chiro-${{ matrix.target }} --self-test 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [[ $STATUS -ne 0 ]]; then
            echo "::error::--self-test exited with status $STATUS"
            exit 1
          fi
      # Hand the Linux binary to the linux-compat job below. Only the Linux
      # leg uploads: macOS cannot run in containers on GitHub Actions.
      - name: Upload Linux binary for container compat tests
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-chiro-linux-x64
          path: dist/chiro-linux-x64

  # The shipped Linux binary is dynamically linked (glibc): building and
  # testing on ubuntu-latest only proves it runs on ubuntu-latest. This job
  # runs the compiled binary's --self-test inside ubuntu:20.04 — the oldest
  # glibc we intend to support — once WITHOUT sox (forcing the worker-pool
  # path) and once WITH the distro's sox (validating the fast-path's
  # byte-identity guarantee against a sox build older than the runner's).
  # Deliberately Ubuntu-only for now: widen to other distros when there are
  # actual non-Ubuntu users.
  linux-compat:
    name: linux-compat (${{ matrix.image }} sox=${{ matrix.sox }})
    runs-on: ubuntu-latest
    needs: smoke-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "ubuntu:20.04"
            sox: without
            setup: ""
            # Without sox the self-test must fall back to the worker pool
            # and say so — grepping the line prevents a silently-degraded
            # pass if the image ever ships sox.
            expect: "sox : absent"
          - image: "ubuntu:20.04"
            sox: with
            setup: "apt-get update -qq && apt-get install -y -qq sox >/dev/null && "
            expect: "byte-identique au pool"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smoke-chiro-linux-x64
          path: dist/
      - name: Run --self-test in container
        run: |
          chmod +x dist/chiro-linux-x64
          set +e
          OUTPUT=$(docker run --rm -v "$PWD/dist:/work:ro" "${{ matrix.image }}" \
            bash -c '${{ matrix.setup }}/work/chiro-linux-x64 --self-test' 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [[ $STATUS -ne 0 ]]; then
            echo "::error::--self-test failed in ${{ matrix.image }} (exit $STATUS)"
            exit 1
          fi
          if [[ "$OUTPUT" != *"${{ matrix.expect }}"* ]]; then
            echo "::error::expected output to contain '${{ matrix.expect }}' in ${{ matrix.image }} — the intended engine path did not run"
            exit 1
          fi
