name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Default least-privilege: read-only. The `release` job opts up to write.
permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      # No `lfs: true`: the heavyweight fixture tests skip cleanly on an
      # LFS-less checkout (RIFF-magic guard) and stay covered by ci.yml —
      # pulling 40 MB of LFS objects per build job would burn quota for
      # coverage the CI already provides. Note the release gate is therefore
      # weaker than CI (no sox, no fixtures): lint + typecheck + format +
      # unit tests only.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # version is read from the `packageManager` field of package.json
      # (pnpm 11 requires Node ≥ 22.13). Don't pin here to avoid
      # "Multiple versions" errors.
      - uses: pnpm/action-setup@v6
      # Pinned: bun is compiled INTO the shipped binary — a floating version
      # means a release can change behavior with no dependency having moved.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # Sync package.json version with the git tag so CHIRO_VERSION
      # (compiled into the binary via src/version.ts) matches the release.
      # Without this step the binary always reports the last value committed
      # to package.json, regardless of the tag — which breaks the in-app
      # update check (the user sees a hint even after upgrading).
      - name: Sync package.json version with tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='${VERSION}'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"
      - run: pnpm install --frozen-lockfile
      # Full gate (lint + typecheck + format + tests) — a tag on a commit
      # whose CI never ran (or failed) must not produce a release.
      - run: pnpm check
      - run: pnpm build:darwin-arm64
      - name: Verify binary version matches tag
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL=$(./dist/chiro-darwin-arm64 --version)
          if [[ "$ACTUAL" != "chiro ${EXPECTED}" ]]; then
            echo "::error::Binary reports '${ACTUAL}' but tag is '${GITHUB_REF_NAME}'"
            exit 1
          fi
      # No sox on release runners (see the lfs/fixtures note above) — this
      # only covers the worker-pool engine, but that's exactly the part that
      # depends on the compiled binary's layout (/$bunfs/ asset resolution),
      # so it's still worth running here.
      - name: Smoke test — --self-test
        run: |
          set +e
          OUTPUT=$(./dist/chiro-darwin-arm64 --self-test 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [[ $STATUS -ne 0 ]]; then
            echo "::error::--self-test exited with status $STATUS"
            exit 1
          fi
      # Ad-hoc codesign (no Apple Developer ID needed): macOS on Apple
      # Silicon refuses to execute a native binary without at least an
      # ad-hoc signature; --force guarantees the final binary carries a
      # valid one. Note: curl does NOT set the com.apple.quarantine xattr
      # (browsers do), so the Gatekeeper first-launch notarization prompt
      # does not apply to the curl|bash install path anyway. See
      # docs/architecture.md § Distribution.
      - name: Ad-hoc codesign (macOS)
        run: codesign --sign - --force --timestamp=none dist/chiro-darwin-arm64
      # Package as versioned tarball. `brew audit --new --strict` rejects URLs
      # pointing to a non-archive asset ("Stable should be a versioned
      # tarball/zip"). Same reason gh, bun, deno ship tarballs.
      - name: Package as tarball
        run: tar -czf dist/chiro-darwin-arm64.tar.gz -C dist chiro-darwin-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: chiro-darwin-arm64
          path: dist/chiro-darwin-arm64.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      # No `lfs: true`: the heavyweight fixture tests skip cleanly on an
      # LFS-less checkout (RIFF-magic guard) and stay covered by ci.yml —
      # pulling 40 MB of LFS objects per build job would burn quota for
      # coverage the CI already provides. Note the release gate is therefore
      # weaker than CI (no sox, no fixtures): lint + typecheck + format +
      # unit tests only.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # version is read from the `packageManager` field of package.json
      # (pnpm 11 requires Node ≥ 22.13). Don't pin here to avoid
      # "Multiple versions" errors.
      - uses: pnpm/action-setup@v6
      # Pinned: bun is compiled INTO the shipped binary — a floating version
      # means a release can change behavior with no dependency having moved.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # See note in build-macos: keep package.json in sync with the tag.
      - name: Sync package.json version with tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='${VERSION}'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"
      - run: pnpm install --frozen-lockfile
      # See note in build-macos: full gate before building a release binary.
      - run: pnpm check
      - run: pnpm build:linux-x64
      - name: Verify binary version matches tag
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL=$(./dist/chiro-linux-x64 --version)
          if [[ "$ACTUAL" != "chiro ${EXPECTED}" ]]; then
            echo "::error::Binary reports '${ACTUAL}' but tag is '${GITHUB_REF_NAME}'"
            exit 1
          fi
      # No sox on release runners (see the lfs/fixtures note above) — this
      # only covers the worker-pool engine, but that's exactly the part that
      # depends on the compiled binary's layout (/$bunfs/ asset resolution),
      # so it's still worth running here.
      - name: Smoke test — --self-test
        run: |
          set +e
          OUTPUT=$(./dist/chiro-linux-x64 --self-test 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [[ $STATUS -ne 0 ]]; then
            echo "::error::--self-test exited with status $STATUS"
            exit 1
          fi
      # Match the macOS asset shape (tarball) so the Homebrew formula and
      # install.sh handle a single download/extract pattern across platforms.
      - name: Package as tarball
        run: tar -czf dist/chiro-linux-x64.tar.gz -C dist chiro-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: chiro-linux-x64
          path: dist/chiro-linux-x64.tar.gz

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: chiro-darwin-arm64
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: chiro-linux-x64
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release tag (v1.2.3-beta.1) must not become the "latest"
          # release: /releases/latest feeds the in-app update check, so an
          # unflagged beta would be pushed to every installed binary.
          FLAGS=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            FLAGS=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${FLAGS[@]}" \
            dist/chiro-darwin-arm64.tar.gz \
            dist/chiro-linux-x64.tar.gz
